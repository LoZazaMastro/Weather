name: Playhub TV source diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: playhub-tv-private-build
          path: staging
      - name: Checkout pristine Aurora 1.1.5 source
        uses: actions/checkout@v4
        with:
          repository: GuiDev1994/aurora-tv
          ref: v1.1.5
          submodules: recursive
          path: aurora-src
      - name: Write focused source diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cd aurora-src
          {
            echo '=== TOP-LEVEL APP FILES ==='
            find src/app -maxdepth 3 -type f | sort | sed -n '1,260p'
            echo '=== USER-FACING AURORA STRINGS ==='
            grep -RIn --exclude-dir=.git --exclude='*.png' --exclude='*.jpg' --exclude='*.mo' -E 'Aurora TV|Aurora' src deploy | sed -n '1,220p' || true
            echo '=== HOME/GRID/TILE/COVER FILES ==='
            grep -RIl --include='*.c' --include='*.h' -E 'grid|tile|cover|poster|app_image|app.*width|app.*height' src/app | sort | sed -n '1,180p' || true
            echo '=== COLOR STYLE FILES ==='
            grep -RIl --include='*.c' --include='*.h' -E 'lv_color_hex|bg_color|bg_opa|radius|border' src/app | sort | sed -n '1,180p' || true
            echo '=== SELECTED MATCHES ==='
            grep -RIn --include='*.c' --include='*.h' -E 'grid|tile|cover|poster|lv_color_hex|bg_color|bg_opa|radius|border' src/app | sed -n '1,500p' || true
            echo '=== DEPLOY ASSETS ==='
            find deploy/webos -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
          } > ../staging/playhub-tv-build/source-diagnostic.txt
      - name: Commit diagnostic to temporary branch
        shell: bash
        working-directory: staging
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add playhub-tv-build/source-diagnostic.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Store Playhub TV source diagnostic [skip ci]'
          git push origin HEAD:playhub-tv-private-build
